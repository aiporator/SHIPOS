<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" aria-labelledby="t03">
  <title id="t03">STK-03 — WERDE 10× · 70×70mm</title>
  <defs>
    <style>
      .bg{fill:#FFFFFF}
      .ink{fill:#0A0A0A}
      .lime{fill:#BFFF00}
      .mono{font-family:'SF Mono','Menlo','Consolas',monospace;font-weight:700;letter-spacing:0.22em;text-transform:uppercase}
      .display{font-family:'Outfit','Inter',system-ui,sans-serif;font-weight:900;font-style:italic;letter-spacing:-0.05em}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="280" height="280"/>
  <rect fill="none" stroke="#0A0A0A" stroke-width="3" x="1.5" y="1.5" width="277" height="277"/>

  <!-- Eyebrow -->
  <text class="mono ink" x="22" y="34" font-size="9">▸ STATEMENT · 003</text>
  <text class="mono ink" text-anchor="end" x="258" y="34" font-size="9" opacity="0.55">LEADER-OS</text>

  <!-- Top rail -->
  <line x1="22" y1="42" x2="258" y2="42" stroke="#0A0A0A" stroke-width="2"/>

  <!-- WERDE -->
  <text class="display ink" x="22" y="100" font-size="46">Werde</text>

  <!-- Massive 10× — number is ink, the × is lime -->
  <text class="display ink" x="22" y="190" font-size="110">10<tspan class="lime">×</tspan></text>

  <!-- Tagline + lime period -->
  <text class="display ink" x="22" y="232" font-size="24">produktiver<tspan class="lime">.</tspan></text>

  <!-- Bottom rail -->
  <line x1="22" y1="244" x2="258" y2="244" stroke="#0A0A0A" stroke-width="2"/>
  <text class="mono ink" x="22" y="262" font-size="8" opacity="0.55">▸ STK · 03 / 06</text>
  <text class="mono ink" text-anchor="end" x="258" y="262" font-size="8" opacity="0.55">WERDE KI-NATIV</text>
</svg>
