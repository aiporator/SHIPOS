<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" aria-labelledby="t05">
  <title id="t05">STK-05 — AI Ownership · Cactus Jack Style · 70×70mm</title>
  <defs>
    <style>
      .bg{fill:#0A0A0A}
      .lime{fill:#BFFF00}
      .white{fill:#FFFFFF}
      .mono{font-family:'SF Mono','Menlo','Consolas',monospace;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;fill:#FFFFFF}
      .display{font-family:'Outfit','Inter',system-ui,sans-serif;font-weight:900;font-style:italic;letter-spacing:-0.05em;fill:#FFFFFF}
    </style>
    <!-- Scribble filter -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
  </defs>

  <!-- Black canvas -->
  <rect class="bg" x="0" y="0" width="280" height="280"/>

  <!-- Eyebrow corner -->
  <text class="mono" x="14" y="28" font-size="9" fill="#BFFF00">▸ LIMITED · 100</text>
  <text class="mono" x="266" y="28" text-anchor="end" font-size="9" opacity="0.55">CACTUS LIME</text>

  <!-- Scribbled AI tag (lime, rough) -->
  <g filter="url(#rough)">
    <text class="display lime" x="42" y="130" font-size="100">AI</text>
  </g>

  <!-- Slash divider hand-drawn -->
  <path d="M 158 60 L 162 220" stroke="#BFFF00" stroke-width="4" stroke-linecap="round" filter="url(#rough)"/>

  <!-- OWNERSHIP clean caps -->
  <text class="display white" x="170" y="115" font-size="30">OWNER</text>
  <text class="display white" x="170" y="148" font-size="30">SHIP<tspan class="lime">.</tspan></text>

  <!-- Tagline -->
  <text class="mono" x="170" y="170" font-size="7.5" opacity="0.7">NICHT SAAS · DEINE INFRA</text>

  <!-- Bottom bar -->
  <rect x="14" y="232" width="252" height="34" fill="#BFFF00"/>
  <text x="140" y="254" text-anchor="middle" font-family="'Outfit',sans-serif" font-weight="900" font-style="italic" font-size="16" fill="#0A0A0A" letter-spacing="-0.02em">DEINE METHODIK · DEIN BOT</text>

  <!-- Corner labels -->
  <text class="mono" x="14" y="226" font-size="7" opacity="0.55">STK · 05 / 06</text>
  <text class="mono" x="266" y="226" text-anchor="end" font-size="7" opacity="0.55">ENTERPRISE</text>
</svg>
