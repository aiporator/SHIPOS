<!--
  /wladbot · Standalone-Ad-Landing, pixel-treu nach der Auria-Cinematic-
  Hero-Spec: Full-Bleed-Loop-Video (eigenes CloudFront-Asset, in der CSP
  freigegeben), Frosted-Glass-Nav, Amber-Badge, Instrument-Serif-H1 mit
  kursivem Kernwort, weiße CTA. Exakt die Spec-Klassenwerte (als CSS
  übersetzt, da statisches HTML statt Vite/Tailwind-v4 — bewusste
  Stack-Entscheidung wie bei /app und /os: null Dependencies, schnellste
  TTFB für Ad-Traffic). Einzige Motionen: Video-Loop + CTA-Hover.

  Brand-Signal ist der WladBot-Avatar (Team-Wunsch): rund im Nav, als
  CTA-Icon und im OG-Image. Kein Apple-Logo (keine App-Store-App — das

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{position:relative;height:100vh;height:100dvh;width:100%;overflow:hidden;background:#000;
  font-family:"Instrument Serif",serif}
a{text-decoration:none;color:inherit}
.bg-video{position:absolute;inset:0;height:100%;width:100%;object-fit:cover}
.col{position:relative;z-index:10;display:flex;height:100%;width:100%;flex-direction:column}

/* nav */
.nav-wrap{display:flex;width:100%;justify-content:center;padding:16px 16px 0}
.nav{display:flex;width:100%;max-width:56rem;align-items:center;justify-content:space-between;
  border-radius:16px;background:rgba(0,0,0,.4);padding:8px 8px 8px 20px;
  -webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:24px;width:24px;border-radius:50%;object-fit:cover;display:block}
.brand span{font-size:18px;letter-spacing:.025em;color:rgba(255,255,255,.9)}
.cta{display:flex;align-items:center;gap:8px;border-radius:12px;background:#fff;padding:8px 16px;
  font-family:Inter,sans-serif;font-size:12px;font-weight:500;letter-spacing:.025em;color:#000;
  transition:all .15s}
.cta:hover{background:rgba(255,255,255,.9)}
.cta img{height:16px;width:16px;border-radius:50%;object-fit:cover;display:block}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;padding:40px 24px 0;text-align:center}
.badge{margin-bottom:24px;display:flex;align-items:center;gap:8px;border-radius:9999px;padding:6px 16px}
.badge svg{height:16px;width:16px;color:#fbbf24}
.badge span{font-family:Inter,sans-serif;font-size:12px;font-weight:500;letter-spacing:.05em;color:#fcd34d}
h1{max-width:56rem;font-size:36px;line-height:.95;font-weight:400;color:#fff}
h1 em{font-style:italic}
.sub{margin:20px auto 0;max-width:36rem;font-family:Inter,sans-serif;font-size:14px;line-height:1.375;
  font-weight:300;color:rgba(255,255,255,.7)}
.br-sm{display:none}

@media (min-width:640px){
  .nav-wrap{padding:24px 24px 0}
  .nav{padding:10px 10px 10px 28px}
  .brand img{height:28px;width:28px}
  .brand span{font-size:20px}
  .cta{padding:10px 20px;font-size:14px}
  .cta img{height:20px;width:20px}
  .hero{padding-top:64px}
  .badge{margin-bottom:32px;padding:8px 20px}
  .badge svg{height:20px;width:20px}
  .badge span{font-size:14px}
  h1{font-size:48px}
  .sub{margin-top:28px;font-size:16px}
  .br-sm{display:inline}
}
@media (min-width:768px){h1{font-size:60px}.sub{font-size:18px}}
@media (min-width:1024px){.hero{padding-top:96px}h1{font-size:72px}}
