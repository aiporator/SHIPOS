name: gitleaks
# Secret scanning · catches accidentally-committed API keys, tokens, JWTs,
# Stripe sk_live_*, Resend re_*, Google OAuth client secrets, etc.
#
# Runs on every PR + every push to mvpcode. A scan-failure (any leak found)
# fails the job and blocks merge if this check is required-status.
#
# Configured to scan the ENTIRE git history on a push to mvpcode (defense
# against a force-push smuggling secrets through), but only the PR diff on a
# pull_request event (fast feedback, lower cost).

on:
  push:
    branches: [mvpcode]
  pull_request:
    branches: [mvpcode]

permissions:
  contents: read

jobs:
  scan:
    name: secret-leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed so the scanner can detect leaks added in old
          # commits that were rebased/squashed into the PR diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # No GITLEAKS_LICENSE needed for public repos · this is the OSS
          # path which is sufficient for our threat model.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Default rules cover ~150 secret patterns (AWS, Stripe, Google,
          # Resend, Slack, Supabase, JWTs, SSH keys, …). We don't ship a
          # custom .gitleaks.toml because the defaults are well-maintained.
          config-path: ''
