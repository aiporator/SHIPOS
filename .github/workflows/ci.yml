name: CI

on:
  push:
    branches:
      - main
      - master
      - claude/install-supabase-cli-Z8CF9
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! python3 -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::Invalid JSON"
              fail=1
            fi
          done < <(git ls-files '*.json')
          exit $fail

      - name: Verify Supabase MCP project ref is unchanged
        run: |
          set -euo pipefail
          expected="srujvjjncrszhaaxepxf"
          actual=$(python3 -c "import json; print(json.load(open('.mcp.json'))['mcpServers']['supabase']['url'])")
          case "$actual" in
            *"project_ref=$expected"*) echo "OK: $actual" ;;
            *) echo "::error::.mcp.json project_ref drifted (expected $expected): $actual"; exit 1 ;;
          esac

      - name: Verify CLAUDE.md mentions the project ref
        run: |
          grep -q "srujvjjncrszhaaxepxf" CLAUDE.md || {
            echo "::error::CLAUDE.md no longer references the Supabase project ref"; exit 1; }

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Markdown
        run: |
          npx --yes markdownlint-cli2@0.13.0 "**/*.md" "#node_modules"
