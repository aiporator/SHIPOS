name: CI

on:
  push:
    branches:
      - main
      - master
      - claude/install-supabase-cli-Z8CF9
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "PWD=$(pwd)"
          echo "Tracked files:"
          git ls-files | head -50
          echo "Tracked JSON files:"
          git ls-files '*.json' || true

      - name: Validate JSON files
        shell: bash
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            echo "Checking $f"
            if python3 -m json.tool "$f" > /dev/null; then
              echo "  OK"
            else
              echo "  FAIL"
              fail=1
            fi
          done
          exit $fail

      - name: Verify Supabase MCP project_ref
        shell: bash
        run: |
          expected="srujvjjncrszhaaxepxf"
          actual=$(python3 -c "import json; print(json.load(open('.mcp.json'))['mcpServers']['supabase']['url'])")
          echo "actual=$actual"
          echo "$actual" | grep -q "project_ref=$expected"

      - name: Verify CLAUDE.md mentions project_ref
        shell: bash
        run: grep -q "srujvjjncrszhaaxepxf" CLAUDE.md

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Markdown
        shell: bash
        run: npx --yes markdownlint-cli2@0.13.0 "**/*.md" "#node_modules" "#.claude/skills/**"
